name: ci

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: RimObs.Dashboard/pnpm-lock.yaml

      - name: pnpm install
        working-directory: RimObs.Dashboard
        run: pnpm install --no-frozen-lockfile

      - name: Build dashboard
        working-directory: RimObs.Dashboard
        run: pnpm build

      - name: dotnet restore
        run: dotnet restore RimObs.slnx

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet format RimObs.slnx --verify-no-changes
          cd RimObs.Dashboard && pnpm lint

      - name: dotnet build
        run: dotnet build RimObs.slnx -c Release --nologo --no-restore

      # coverlet's IL instrumentation inflates a timed hot path about tenfold, so the
      # wall-clock benchmarks run in a second pass with the collector switched off.
      - name: dotnet test
        run: |
          dotnet test RimObs.slnx -c Release --nologo --no-build \
            --logger "console;verbosity=normal" --filter "Category!=Benchmark"
          dotnet test tests/RimObs.Library.Tests/RimObs.Library.Tests.csproj -c Release \
            --nologo --no-build --logger "console;verbosity=normal" \
            -p:RunSettingsFilePath= --filter "Category=Benchmark"

  prose:
    name: prose
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vale
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # reviewdog
        with:
          reporter: github-pr-check
          fail_on_error: true
