name: ci

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: RimObs.Dashboard/pnpm-lock.yaml

      - name: pnpm install
        working-directory: RimObs.Dashboard
        run: pnpm install --no-frozen-lockfile

      - name: Build dashboard
        working-directory: RimObs.Dashboard
        run: pnpm build

      - name: dotnet restore
        run: dotnet restore RimObs.sln

      - name: dotnet build
        run: dotnet build RimObs.sln -c Release --nologo --no-restore

      - name: dotnet test
        run: dotnet test RimObs.sln -c Release --nologo --no-build --logger "console;verbosity=normal"
