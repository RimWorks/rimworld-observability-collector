name: ci

on:
  # no push trigger: release.yml calls this workflow, so a push would run everything twice.
  pull_request:
    branches: [main, beta]
  workflow_call:

# release.yml holds contents: write, and a called workflow would inherit it without this.
permissions:
  contents: read

# literal prefix: github.workflow is the caller's name in a called workflow.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # windows defaults to powershell, which reads the \ continuations below as an operator.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: RimObs.Dashboard/pnpm-lock.yaml

      - name: pnpm install
        working-directory: RimObs.Dashboard
        run: pnpm install --no-frozen-lockfile

      - name: Build dashboard
        working-directory: RimObs.Dashboard
        run: pnpm build

      - name: dotnet restore
        run: dotnet restore RimObs.slnx

      - name: dotnet build
        run: dotnet build RimObs.slnx -c Release --nologo --no-restore

      # coverlet's IL instrumentation inflates a timed hot path about tenfold, so the
      # wall-clock benchmarks run in a second pass with the collector switched off.
      - name: dotnet test
        run: |
          dotnet test RimObs.slnx -c Release --nologo --no-build \
            --logger "console;verbosity=normal" --filter "Category!=Benchmark"
          dotnet test tests/RimObs.Library.Tests/RimObs.Library.Tests.csproj -c Release \
            --nologo --no-build --logger "console;verbosity=normal" \
            -p:RunSettingsFilePath= --filter "Category=Benchmark"

      # last on purpose, so a formatting nit never hides a real test failure.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet format RimObs.slnx --verify-no-changes
          cd RimObs.Dashboard && pnpm lint

  prose:
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@eae5a8f32bee86128ae88bf8821ebaca65ddc1e9 # v1.4.1

  links:
    # no lychee.toml here, so the shared default --config arg is dropped.
    uses: RimWorks/mod-ci/.github/workflows/links.yml@eae5a8f32bee86128ae88bf8821ebaca65ddc1e9 # v1.4.1
    with:
      args: --no-progress README.md README.template.md
