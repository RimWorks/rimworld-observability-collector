name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    # dependabot PRs get no repository secrets, so SONAR_TOKEN is empty and the scan cannot authenticate.
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: RimObs.Dashboard/pnpm-lock.yaml
      - name: Build and test dashboard
        working-directory: RimObs.Dashboard
        shell: powershell
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
          pnpm vitest run --coverage
          # lcov writes paths relative to the dashboard dir, sonar resolves them from the repo root.
          (Get-Content coverage\lcov.info) -replace '^SF:', 'SF:RimObs.Dashboard/' | Set-Content coverage\lcov.info

      # analyzer-severity stays off until the 25 S1481 warnings in the test projects are cleared.
      # The benchmarks read ~4x slow under coverlet, so ci.yml runs them in its own uninstrumented pass.
      - uses: RimWorks/mod-ci/.github/actions/dotnet-sonar@2a8b2eb8444b7234f83da46d4c9c1cfe50ccea0f
        with:
          solution: RimObs.slnx
          project-key: RimWorks_rimworld-observability-collector
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          dotnet-version: |
            8.0.x
            10.0.x
          analyzer-severity: none
          test-filter: Category!=Benchmark
          exclusions: RimObs.Dashboard/scripts/**,RimObs.Dashboard/dist/**
          coverage-exclusions: "**/*.test.*,**/*.spec.*,RimObs.Dashboard/src/report/**"
          extra-begin-args: /d:sonar.javascript.lcov.reportPaths=RimObs.Dashboard/coverage/lcov.info
