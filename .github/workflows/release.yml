name: release

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the owner pushes to main with admin bypass, so branch protection cannot gate publishing.
  # calling the checks here is what stops a broken commit reaching nuget or steam.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  sonar:
    uses: ./.github/workflows/sonar.yml
    secrets: inherit

  release:
    name: semantic-release
    needs: [ci, sonar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: pnpm install (dashboard)
        working-directory: RimObs.Dashboard
        run: pnpm install --no-frozen-lockfile

      # dist/ is an embedded resource in the collector, so this is packaging, not a check.
      - name: Build dashboard
        working-directory: RimObs.Dashboard
        run: pnpm build

      - name: dotnet restore
        run: dotnet restore RimObs.slnx

      # Assemblies/ is gitignored, so a checkout has no DLLs. Skipping this publishes a
      # mod with no code in it. The ci job checks the build, this one produces it.
      - name: dotnet build
        run: dotnet build RimObs.slnx -c Release --nologo --no-restore

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - uses: RimWorks/mod-ci/.github/actions/steam-login@79a54854b2795cf5cc12025b3d86ede3b354af94 # v1.3.0
        with:
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          steam-username: ${{ secrets.STEAM_USERNAME }}

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          WORKSHOP_ID: ${{ vars.WORKSHOP_ID }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: npx --no-install semantic-release
