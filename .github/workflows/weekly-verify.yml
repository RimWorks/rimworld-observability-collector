name: weekly-verify

on:
  schedule:
    # Saturday 16:00 UTC, staggered so the repos never push Steam at once.
    - cron: '0 16 * * 6'
  workflow_dispatch:

permissions:
  contents: read

# shares the release group so two workflows never push the same workshop item at once
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify against current RimWorld, then republish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Krafs.Rimworld.Ref floats on 1.6.* with no lock file, so this is where a new
      # RimWorld release enters and where breakage would first show up.
      - name: dotnet restore
        run: dotnet restore RimObs.slnx

      - name: Record resolved RimWorld version
        run: |
          version=$(dotnet list RimObs.slnx package \
            | awk '/Krafs.Rimworld.Ref/ {print $NF; exit}')
          echo "RIMWORLD_REF=${version:-unknown}" >> "$GITHUB_ENV"
          echo "resolved RimWorld ref: ${version:-unknown}"

      # Assemblies/ is gitignored, so a checkout has no DLLs. Skipping this publishes a
      # mod with no code in it.
      - name: dotnet build
        run: dotnet build RimObs.slnx -c Release --nologo --no-restore

      # coverlet's IL instrumentation inflates a timed hot path about tenfold, so the
      # wall-clock benchmarks run in a second pass with the collector switched off.
      - name: dotnet test
        run: |
          set -o pipefail
          dotnet test RimObs.slnx -c Release --nologo --no-build \
            --logger "console;verbosity=normal" --filter "Category!=Benchmark" | tee test-output.txt
          dotnet test tests/RimObs.Library.Tests/RimObs.Library.Tests.csproj -c Release \
            --nologo --no-build --logger "console;verbosity=normal" \
            -p:RunSettingsFilePath= --filter "Category=Benchmark" | tee -a test-output.txt
          passed=$(grep -oE 'Passed:[[:space:]]+[0-9]+' test-output.txt | grep -oE '[0-9]+' | paste -sd+ | bc)
          echo "TESTS_PASSED=${passed:-unknown}" >> "$GITHUB_ENV"

      # Collector/ is gitignored and ships to the workshop, so publishing without it would
      # strip the collector binaries from the item.
      - name: Build the collector payload
        run: make publish-collector

      - uses: RimWorks/mod-ci/.github/actions/steam-republish@817b60ffe7212ed6cc23f31f3e9a773f146f994c
        with:
          workshop-id: ${{ vars.WORKSHOP_ID }}
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          verified-rimworld: ${{ env.RIMWORLD_REF }}
          verified-tests: ${{ env.TESTS_PASSED }}
